services:
  db:
    image: postgres:16-alpine
    container_name: postgres-account-db
    environment:
      POSTGRES_USER: alex
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: afonya
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
